[project]
name = "restock"
version = "0.1.0"
description = "RL-learned selective schema reading for API agents"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Mahdiar Khodabakhshi", email = "mahdiar.edu@gmail.com" }]
dependencies = [
    "graphql-core>=3.3",
    "httpx>=0.27",
]

[project.scripts]
restock = "restock.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/restock"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
